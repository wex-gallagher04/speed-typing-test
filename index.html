<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYPE//SPEED</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #e8ff47;
    --accent2: #ff4778;
    --text: #e2e2f0;
    --muted: #4a4a6a;
    --correct: #4ade80;
    --wrong: #ff4778;
    --cursor: #e8ff47;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 820px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 3rem;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    line-height: 1;
  }

  .logo span {
    color: var(--accent2);
  }

  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Passage selector */
  .passage-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .tab {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    border-radius: 2px;
  }

  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 2rem;
    margin-bottom: 1.5rem;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    line-height: 1;
    color: var(--text);
    transition: color 0.2s;
  }

  .stat-value.highlight { color: var(--accent); }
  .stat-unit {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-left: 2px;
  }

  /* Progress bar */
  .progress-track {
    height: 2px;
    background: var(--border);
    margin-bottom: 1.5rem;
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.1s ease;
    border-radius: 1px;
  }

  /* Typing area */
  .typing-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2.5rem;
    margin-bottom: 1.5rem;
    position: relative;
    cursor: text;
    transition: border-color 0.2s;
  }

  .typing-area:focus-within { border-color: var(--muted); }
  .typing-area.active-typing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)22; }

  .passage-display {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    line-height: 2;
    letter-spacing: 0.02em;
    word-break: break-word;
    position: relative;
    user-select: none;
  }

  .char {
    position: relative;
    transition: color 0.05s;
  }

  .char.correct { color: var(--correct); }
  .char.wrong { color: var(--wrong); background: rgba(255,71,120,0.12); border-radius: 1px; }
  .char.pending { color: var(--muted); }
  .char.active { color: var(--text); }

  .char.cursor::after {
    content: '';
    position: absolute;
    left: 0;
    top: 10%;
    height: 80%;
    width: 2px;
    background: var(--cursor);
    animation: blink 0.8s step-end infinite;
    border-radius: 1px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Hidden input */
  #hidden-input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
    top: 0;
    left: 0;
  }

  /* Click prompt */
  .click-prompt {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: rgba(10,10,15,0.6);
    border-radius: 4px;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .click-prompt.hidden { opacity: 0; }

  /* Bottom row */
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .accuracy-pills {
    display: flex;
    gap: 0.75rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
  }

  .pill {
    padding: 0.3rem 0.75rem;
    border-radius: 99px;
    border: 1px solid;
  }

  .pill.correct-pill { color: var(--correct); border-color: var(--correct)44; background: rgba(74,222,128,0.06); }
  .pill.wrong-pill { color: var(--wrong); border-color: var(--wrong)44; background: rgba(255,71,120,0.06); }

  .reset-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 0.6rem 1.5rem;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s ease;
    border-radius: 2px;
  }

  .reset-btn:hover { background: var(--accent); color: var(--bg); }
  .reset-btn:active { transform: scale(0.97); }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .result-overlay.show { display: flex; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3rem;
    max-width: 480px;
    width: 90%;
    text-align: center;
    border-radius: 6px;
  }

  .result-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .result-wpm {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 7rem;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }

  .result-wpm-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
    padding: 1.5rem;
    background: var(--bg);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .result-stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.3rem;
  }

  .result-stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--text);
    line-height: 1;
  }

  .result-stat-val.good { color: var(--correct); }
  .result-stat-val.bad { color: var(--wrong); }

  .result-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
  }

  .btn-primary {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 0.75rem 2rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.15s;
    border-radius: 2px;
  }

  .btn-primary:hover { background: #fff; }

  .btn-secondary {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 0.75rem 2rem;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
  }

  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }

  /* Grade badge */
  .grade-badge {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    padding: 0.3rem 1rem;
    border-radius: 2px;
    margin-bottom: 1.5rem;
  }

  .grade-S { background: rgba(232,255,71,0.15); color: var(--accent); border: 1px solid var(--accent)66; }
  .grade-A { background: rgba(74,222,128,0.12); color: var(--correct); border: 1px solid var(--correct)44; }
  .grade-B { background: rgba(96,165,250,0.12); color: #60a5fa; border: 1px solid #60a5fa44; }
  .grade-C { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid #fbbf2444; }
  .grade-D { background: rgba(255,71,120,0.12); color: var(--wrong); border: 1px solid var(--wrong)44; }

  @media (max-width: 600px) {
    .logo { font-size: 2rem; }
    .typing-area { padding: 1.5rem; }
    .passage-display { font-size: 0.9rem; }
    .stats-bar { gap: 1rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">TYPE<span>//</span>SPEED</div>
    <div class="tagline">Measure your words per minute</div>
  </header>

  <div class="passage-tabs" id="tabs"></div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label">WPM</div>
      <div class="stat-value" id="wpm-display">—<span class="stat-unit"></span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Accuracy</div>
      <div class="stat-value" id="acc-display">—<span class="stat-unit"></span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Progress</div>
      <div class="stat-value" id="prog-display">0<span class="stat-unit">%</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Elapsed</div>
      <div class="stat-value" id="time-display">0.0<span class="stat-unit">s</span></div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="typing-area" id="typing-area" onclick="focusInput()">
    <div class="passage-display" id="passage-display"></div>
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="click-prompt" id="click-prompt">Click here to start typing</div>
  </div>

  <div class="bottom-row">
    <div class="accuracy-pills">
      <div class="pill correct-pill">✓ <span id="correct-count">0</span></div>
      <div class="pill wrong-pill">✗ <span id="wrong-count">0</span></div>
    </div>
    <button class="reset-btn" onclick="resetTest()">↺ Reset</button>
  </div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-title">Test Complete</div>
    <div class="result-wpm" id="result-wpm">0</div>
    <div class="result-wpm-label">Words Per Minute</div>
    <div class="grade-badge" id="grade-badge"></div>
    <div class="result-grid">
      <div>
        <div class="result-stat-label">Accuracy</div>
        <div class="result-stat-val good" id="result-acc">0%</div>
      </div>
      <div>
        <div class="result-stat-label">Correct</div>
        <div class="result-stat-val good" id="result-correct">0</div>
      </div>
      <div>
        <div class="result-stat-label">Errors</div>
        <div class="result-stat-val bad" id="result-errors">0</div>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn-primary" onclick="retryTest()">Try Again</button>
      <button class="btn-secondary" onclick="nextPassage()">Next Text</button>
    </div>
  </div>
</div>

<script>
  const passages = [
    {
      label: "Backburner",
      text: "maybe im just not better than this i haven't tried cause maybe you'll finally choose me after you've had more time i thought i was a fast learner but guess i won't ever mind guess i won't ever mind"
    },
    {
      label: "Did You like Her In The Morning",
      text: "i know it'd be easier if i just didn't ask but it'd also be easier if she wasn't your last did you like her touch at night time? did all the pretending help you forget? was she weightless in just your sweater? and does it feel heavy now to look at me instead?"
    },
    {
      label: "Anaheim",
      text: "but i'd give anything to stop time and drive around Anaheim at sundown to teach my mind to put you first here you are a hero you wanna be my new home but baby let up i won't ever recognize these roads cause i am lost but not in you yes i am lost but not in you"
    },

  ];

  let currentPassageIndex = 0;
  let typed = [];
  let startTime = null;
  let timerInterval = null;
  let isComplete = false;
  let totalErrors = 0;

  // Build tabs
  const tabContainer = document.getElementById('tabs');
  passages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = p.label;
    btn.onclick = () => selectPassage(i);
    tabContainer.appendChild(btn);
  });

  function selectPassage(index) {
    currentPassageIndex = index;
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
    resetTest();
  }

  function buildPassageDisplay() {
    const text = passages[currentPassageIndex].text;
    const display = document.getElementById('passage-display');
    display.innerHTML = '';
    text.split('').forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'char pending' + (i === 0 ? ' cursor' : '');
      span.textContent = ch;
      span.dataset.index = i;
      display.appendChild(span);
    });
  }

  function focusInput() {
    const input = document.getElementById('hidden-input');
    input.focus();
    document.getElementById('click-prompt').classList.add('hidden');
  }

  function updateDisplay() {
    const text = passages[currentPassageIndex].text;
    const chars = document.querySelectorAll('.char');
    let correctCount = 0;
    let wrongCount = 0;

    chars.forEach((span, i) => {
      span.className = 'char';
      if (i < typed.length) {
        if (typed[i] === text[i]) {
          span.classList.add('correct');
          correctCount++;
        } else {
          span.classList.add('wrong');
          wrongCount++;
        }
      } else if (i === typed.length) {
        span.classList.add('active', 'cursor');
      } else {
        span.classList.add('pending');
      }
    });

    document.getElementById('correct-count').textContent = correctCount;
    document.getElementById('wrong-count').textContent = wrongCount;

    const progress = Math.round((typed.length / text.length) * 100);
    document.getElementById('prog-display').textContent = progress;
    document.getElementById('progress-fill').style.width = progress + '%';

    const accuracy = typed.length > 0 ? Math.round((correctCount / typed.length) * 100) : 0;
    document.getElementById('acc-display').textContent = typed.length > 0 ? accuracy + '%' : '—';

    // Scroll cursor into view
    const cursor = document.querySelector('.cursor');
    if (cursor) cursor.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function updateWPM() {
    if (!startTime) return;
    const elapsed = (Date.now() - startTime) / 1000 / 60;
    const wordsTyped = typed.length / 5;
    const wpm = elapsed > 0 ? Math.round(wordsTyped / elapsed) : 0;
    document.getElementById('wpm-display').innerHTML = wpm + '<span class="stat-unit"> wpm</span>';

    const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('time-display').innerHTML = elapsedSec + '<span class="stat-unit">s</span>';
  }

  document.getElementById('hidden-input').addEventListener('input', function(e) {
    if (isComplete) return;
    const text = passages[currentPassageIndex].text;

    // Start timer on first key
    if (!startTime) {
      startTime = Date.now();
      timerInterval = setInterval(updateWPM, 100);
      document.getElementById('typing-area').classList.add('active-typing');
    }

    const val = this.value;
    typed = val.split('');

    // Count errors for this position
    let errors = 0;
    typed.forEach((ch, i) => {
      if (i < text.length && ch !== text[i]) errors++;
    });
    totalErrors = errors;

    updateDisplay();

    // Check completion
    if (typed.length >= text.length) {
      finishTest();
    }
  });

  document.getElementById('hidden-input').addEventListener('keydown', function(e) {
    // Prevent going beyond text length
    const text = passages[currentPassageIndex].text;
    if (typed.length >= text.length && e.key !== 'Backspace') {
      e.preventDefault();
    }
  });

  function finishTest() {
    isComplete = true;
    clearInterval(timerInterval);
    const text = passages[currentPassageIndex].text;
    const elapsed = (Date.now() - startTime) / 1000;
    const elapsedMin = elapsed / 60;
    const totalChars = typed.length;
    const wordsTyped = totalChars / 5;
    const wpm = Math.round(wordsTyped / elapsedMin);

    let correctCount = 0;
    typed.forEach((ch, i) => { if (i < text.length && ch === text[i]) correctCount++; });
    const accuracy = Math.round((correctCount / totalChars) * 100);
    const errors = totalChars - correctCount;

    // Grade
    let grade, gradeClass;
    if (wpm >= 100 && accuracy >= 97) { grade = 'S — LEGENDARY'; gradeClass = 'grade-S'; }
    else if (wpm >= 80 && accuracy >= 95) { grade = 'A — EXCELLENT'; gradeClass = 'grade-A'; }
    else if (wpm >= 60 && accuracy >= 90) { grade = 'B — GOOD'; gradeClass = 'grade-B'; }
    else if (wpm >= 40 && accuracy >= 85) { grade = 'C — AVERAGE'; gradeClass = 'grade-C'; }
    else { grade = 'D — KEEP PRACTICING'; gradeClass = 'grade-D'; }

    document.getElementById('result-wpm').textContent = wpm;
    document.getElementById('result-acc').textContent = accuracy + '%';
    document.getElementById('result-correct').textContent = correctCount;
    document.getElementById('result-errors').textContent = errors;
    const badge = document.getElementById('grade-badge');
    badge.textContent = grade;
    badge.className = 'grade-badge ' + gradeClass;

    document.getElementById('result-overlay').classList.add('show');
  }

  function resetTest() {
    isComplete = false;
    typed = [];
    startTime = null;
    totalErrors = 0;
    clearInterval(timerInterval);

    document.getElementById('hidden-input').value = '';
    document.getElementById('wpm-display').innerHTML = '—<span class="stat-unit"></span>';
    document.getElementById('acc-display').innerHTML = '—<span class="stat-unit"></span>';
    document.getElementById('prog-display').innerHTML = '0<span class="stat-unit">%</span>';
    document.getElementById('time-display').innerHTML = '0.0<span class="stat-unit">s</span>';
    document.getElementById('correct-count').textContent = '0';
    document.getElementById('wrong-count').textContent = '0';
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('typing-area').classList.remove('active-typing');
    document.getElementById('click-prompt').classList.remove('hidden');
    document.getElementById('result-overlay').classList.remove('show');

    buildPassageDisplay();
  }

  function retryTest() {
    document.getElementById('result-overlay').classList.remove('show');
    resetTest();
    setTimeout(focusInput, 100);
  }

  function nextPassage() {
    currentPassageIndex = (currentPassageIndex + 1) % passages.length;
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === currentPassageIndex));
    document.getElementById('result-overlay').classList.remove('show');
    resetTest();
    setTimeout(focusInput, 100);
  }

  // Init
  buildPassageDisplay();
</script>
</body>
</html>
